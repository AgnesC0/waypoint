# Waypoint configuration
# Add one entry per project you want Waypoint to recognise.
# `path` is matched against the working directory of each terminal session —
# any subdirectory of the path also counts as a match.

poll_interval: 2       # seconds between scans
opacity: 0.88          # window opacity  (0.0 – 1.0)
position: bottom-right # top-left | top-right | bottom-left | bottom-right

projects:
  - name: Waypoint
    path: ~/waypoint

  - name: CogPass Light
    path: ~/CogPass-Light
