# ─────────────────────────────────────────────────────────────────────────────
# Waypoint — configuration
#
# Waypoint scans your running `claude` processes, resolves their working
# directories, and matches the paths against the keywords you define here.
# ─────────────────────────────────────────────────────────────────────────────

# Seconds between scans. Lower = more responsive; higher = less CPU.
poll_interval: 2

# Window transparency (0.0 = invisible, 1.0 = solid).
opacity: 0.92

# Starting corner. Options: top-left | top-right | bottom-left | bottom-right
position: bottom-right

# ── Projects ─────────────────────────────────────────────────────────────────
# name     — label shown in the HUD
# keywords — matched against the working-directory path of each claude process
#            (case-insensitive substring match)
# color    — hex accent color for the left stripe and top bar
#
# Tip: use the folder name or a unique slug from your project path.
# E.g. if you work in ~/code/project-alpha, the keyword "project-alpha" works.
# ─────────────────────────────────────────────────────────────────────────────
projects:
  - name: Project Alpha
    keywords:
      - project-alpha
      - alpha
    color: "#7e3af2"   # purple

  - name: Project Beta
    keywords:
      - project-beta
      - beta
    color: "#f97316"   # orange
